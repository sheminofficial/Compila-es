name: Temporary Atelie source retrieval
on:
  push:
    paths:
      - .github/workflows/atelie-source-fetch.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public build assets
        run: |
          mkdir -p atelie-source-tmp
          curl --fail --location --retry 3 'https://bc7b2de4.atelie-lumie.pages.dev/assets/AdminConsole-BkmEzLmU.js' -o atelie-source-tmp/admin.js
          curl --fail --location --retry 3 'https://bc7b2de4.atelie-lumie.pages.dev/assets/index-CJiDikbt.js' -o atelie-source-tmp/app.js
          curl --fail --location --retry 3 'https://bc7b2de4.atelie-lumie.pages.dev/assets/index-BjMqHeAR.css' -o atelie-source-tmp/app.css
          wc -c atelie-source-tmp/*
      - name: Commit temporary files
        run: |
          git config user.name "Codex temporary retrieval"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atelie-source-tmp
          git commit -m "Temporary Atelie build source for versions implementation"
          git push
