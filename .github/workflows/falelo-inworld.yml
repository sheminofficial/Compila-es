name: Falelo Inworld batch
on:
  workflow_dispatch:
    inputs:
      action:
        description: Generate all, validate, submit or collect
        type: choice
        options: [generate, validate, submit, collect]
        required: true
      batch_number:
        description: Batch number for submit (1 to 5)
        type: string
        required: false
      operation_name:
        description: Complete operation name for collect
        type: string
        required: false
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Run Inworld batch
        env:
          INWORLD_API_KEY: ${{ secrets.INWORLD_API_KEY }}
          ACTION: ${{ inputs.action }}
          BATCH: ${{ inputs.batch_number }}
          OPERATION: ${{ inputs.operation_name }}
        run: |
          if [ "$ACTION" = validate ]; then
            python3 inworld_batch.py validate
          elif [ "$ACTION" = submit ]; then
            python3 inworld_batch.py submit --batch "$BATCH"
          elif [ "$ACTION" = collect ]; then
            python3 inworld_batch.py collect --operation "$OPERATION"
          elif [ "$ACTION" = generate ]; then
            python3 inworld_batch.py generate
          fi
      - name: Download audio artifact
        if: always() && (inputs.action == 'collect' || inputs.action == 'generate')
        uses: actions/upload-artifact@v4
        with:
          name: falelo-audios
          path: |
            audios/
            operacoes.json
            vozes-escolhidas.json
          if-no-files-found: ignore
