name: Falelo — private Worker bundle for Cloudflare connector
on:
  push:
    branches: [main]
    paths: ['.github/workflows/falelo-worker-bundle-export.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sheminofficial/Shemin-Official
          ref: feature/falelo-migration
          token: ${{ secrets.FALELO_BUILD }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - name: Compile Worker locally (never publish from GitHub)
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.FALELO_BUILD }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund >/tmp/falelo-npm.log 2>&1
          npm run build:learning >/tmp/falelo-scala.log 2>&1 || { echo 'Scala.js compilation failed.'; exit 1; }
          if ! npx --yes wrangler@4.139.0 deploy --config worker/wrangler.falelo.production.toml --dry-run --outdir /tmp/falelo-worker-output > /tmp/falelo-dryrun.log 2>&1; then
            grep -E 'Error|ERROR|error|invalid|Unexpected|Failed|failed' /tmp/falelo-dryrun.log | tail -n 18 > /tmp/falelo-private-error.txt || true
            if [ -s /tmp/falelo-private-error.txt ]; then
              gh release create "falelo-worker-build-error-${GITHUB_RUN_ID}" --repo sheminofficial/Shemin-Official \
                --target feature/falelo-migration --title "Falelo Worker build diagnostics" \
                --notes-file /tmp/falelo-private-error.txt --prerelease >/dev/null 2>&1 || true
            fi
            echo "Worker dry-run failed. Details saved privately."
            exit 1
          fi
          find /tmp/falelo-worker-output -type f -name '*.js' -printf '%s %p\n'
          test -n "$(find /tmp/falelo-worker-output -type f -name '*.js' -print -quit)"
      - name: Save bundle as private GitHub blob (not a public artifact)
        env:
          GH_TOKEN: ${{ secrets.FALELO_BUILD }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,base64
          files=list(Path('/tmp/falelo-worker-output').rglob('*.js'))
          assert len(files)>=1
          # Prefer the main bundle created by the Wrangler dry-run, not a source map.
          target=next((f for f in files if f.name in ('index.js','worker.js')), max(files,key=lambda p:p.stat().st_size))
          raw=target.read_bytes()
          assert 10000<len(raw)<2400000, f'Unexpected bundle size {len(raw)} bytes'
          body={'message':'build: private Cloudflare Worker bundle from production source','branch':'feat/falelo-worker-artifact-20261101','content':base64.b64encode(raw).decode()}
          Path('/tmp/falelo-upload-worker.json').write_text(json.dumps(body))
          print('Private bundle ready: bytes',len(raw))
          PY
          gh api repos/sheminofficial/Shemin-Official/contents/deployment-artifacts/falelo-worker.js -X PUT \
            -H 'Accept: application/vnd.github+json' \
            --input /tmp/falelo-upload-worker.json --jq '.commit.sha' >/tmp/falelo-commit-sha
          test -s /tmp/falelo-commit-sha
          echo "Worker source staged privately for Cloudflare connector."
      - name: Remove temporary source and logs
        if: always()
        run: rm -rf source /tmp/falelo-worker-output /tmp/falelo-upload-worker.json /tmp/falelo-commit-sha /tmp/falelo-npm.log /tmp/falelo-dryrun.log /tmp/falelo-private-error.txt
