name: Falelo private-source production deployment
# Generic runner-only orchestration; Falelo source and final deliverables stay private.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/falelo-private-production.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: falelo-production-public-runner
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private source ephemerally
        uses: actions/checkout@v4
        with:
          repository: sheminofficial/Shemin-Official
          ref: feature/falelo-migration
          token: ${{ secrets.FALELO_BUILD }}
          persist-credentials: false
          path: source
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Build and verify protected code
        working-directory: source
        run: |
          set -euo pipefail
          run_private() {
            local label="$1"; shift
            if ! "$@" >"/tmp/falelo-${label}.log" 2>&1; then
              echo "Private ${label} failed; no private logs published."
              exit 1
            fi
            echo "Private ${label} passed."
          }
          run_private install npm install --no-fund --no-audit
          run_private scala npm run build:learning
          run_private worker npm run check:worker
          run_private selector node --experimental-strip-types --test tests/test_story_assignment.mjs
          run_private types npm run typecheck
          run_private tests npm test
          run_private frontend npm run build
          cd falelo-stories/player
          run_private player-install npm install --no-fund --no-audit
          run_private player-tests npm test
          run_private player-build npm run build
          mkdir -p ../../dist/stories
          cp -R dist/. ../../dist/stories/
          test -s ../../dist/stories/index.html
      - name: Deliver built site to protected private repository
        id: artifact
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.FALELO_BUILD }}
        run: |
          set -euo pipefail
          tar -C dist -czf falelo-production.tar.gz .
          sha256sum falelo-production.tar.gz > falelo-production.sha256
          tag="falelo-production-${GITHUB_RUN_ID}"
          gh release create "$tag" falelo-production.tar.gz falelo-production.sha256 --repo sheminofficial/Shemin-Official --target feature/falelo-migration --title "Falelo production ${GITHUB_RUN_ID}" --notes "Private compiled production output, verified by SHA-256 in the public build runner." --prerelease
          mkdir -p verify
          gh release download "$tag" --repo sheminofficial/Shemin-Official --pattern falelo-production.tar.gz --dir verify
          cmp falelo-production.tar.gz verify/falelo-production.tar.gz
          echo "verified_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Verified delivery to private release."
      - name: Deploy Cloudflare Worker before the site
        working-directory: source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FALELO_PAGES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          if ! npx --yes wrangler@4.139.0 deploy --config worker/wrangler.falelo.production.toml --keep-vars > /tmp/falelo-worker-deploy.log 2>&1; then
            echo "Worker deployment failed. Existing production remains unchanged for the site."
            exit 1
          fi
          echo "Worker deployed, existing secrets preserved."
      - name: Publish Pages on configured production branch
        working-directory: source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FALELO_PAGES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.139.0 pages deploy dist --project-name falelo --branch feature/falelo-migration > /tmp/falelo-pages-deploy.log 2>&1 || { echo "Pages production deployment failed."; exit 1; }
          echo "Pages production deployed."
      - name: Verify production health
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --max-time 30 https://falelo.pages.dev/api/health > /tmp/falelo-health.json
          grep -q '"service":"falelo-api"' /tmp/falelo-health.json
          curl -fsSL --retry 3 --retry-delay 2 --max-time 30 https://falelo.pages.dev/stories/index.html >/tmp/falelo-stories-page.html
          grep -q 'script' /tmp/falelo-stories-page.html
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 https://falelo.pages.dev/api/me)" = "401"
          echo "PASS: Worker health, story player, protected API."
      - name: Delete all runner-only copies and logs
        if: always()
        run: |
          rm -f /tmp/falelo-*.log /tmp/falelo-*.json /tmp/falelo-stories-page.html
          rm -rf source/verify source/falelo-production.tar.gz source/falelo-production.sha256 source
