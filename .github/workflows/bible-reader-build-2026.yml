name: Temporary Scripture Reader EPUB Build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bible-reader-build-2026.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bible-english-reader-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install ebooklib beautifulsoup4 lxml
      - name: Generate full EPUB
        run: python scripture_reader/build_reader.py
      - name: Upload file
        uses: actions/upload-artifact@v4
        with:
          name: scripture-english-reader
          path: generated/Scripture_Stories_English_Reader_66_Books.epub
      - name: Save EPUB in isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f generated/Scripture_Stories_English_Reader_66_Books.epub
          git diff --cached --quiet || (git commit -m 'Save full 66-book English Scripture reader EPUB' && git push origin HEAD:bible-english-reader-2026)
