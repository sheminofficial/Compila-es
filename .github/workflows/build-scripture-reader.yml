name: Build Story-First Bible EPUB
on:
  push:
    branches:
      - bible-english-reader-2026
      - bible-literary-retelling-2026
    paths:
      - 'scripture_reader/**'
      - '.github/workflows/build-scripture-reader.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripture_reader/**'
      - '.github/workflows/build-scripture-reader.yml'
  workflow_dispatch:
concurrency:
  group: scripture-reader-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  epub:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated ebook branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ebook tooling
        run: python -m pip install --disable-pip-version-check ebooklib==0.19 beautifulsoup4==4.13.4 lxml==5.4.0
      - name: Build and validate annotated source reader
        run: python scripture_reader/build_reader.py
      - name: Build literary manuscript EPUB and coverage report
        if: github.ref_name == 'bible-literary-retelling-2026'
        run: python scripture_reader/build_literary_epub.py
      - name: Install official EPUBCheck 5.4.0
        run: |
          curl --fail --location --retry 3 https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip --output /tmp/epubcheck.zip
          unzip -q /tmp/epubcheck.zip -d /tmp
      - name: Validate every generated EPUB with EPUBCheck
        run: |
          set -e
          for epub in generated/*.epub; do
            report="generated/$(basename "$epub" .epub)-epubcheck.json"
            java -jar /tmp/epubcheck-5.4.0/epubcheck.jar "$epub" --json "$report"
          done
      - name: Upload immutable EPUB artifacts and validation reports
        uses: actions/upload-artifact@v4
        with:
          name: bible-story-first-reader-${{ github.ref_name }}-${{ github.sha }}
          path: |
            generated/Scripture_Stories_English_Reader_66_Books.epub
            generated/The_Bible_Retold_Editorial_Preview.epub
            generated/The_Bible_Retold_Complete_English_Edition.epub
            generated/retelling-coverage.json
            generated/*-epubcheck.json
          if-no-files-found: error
          retention-days: 60
