name: Build Story-First Bible EPUB
on:
  push:
    branches:
      - bible-english-reader-2026
      - bible-literary-retelling-2026
    paths:
      - 'scripture_reader/**'
      - '.github/workflows/build-scripture-reader.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripture_reader/**'
      - '.github/workflows/build-scripture-reader.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  epub:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated ebook branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ebook tooling
        run: python -m pip install --disable-pip-version-check ebooklib==0.19 beautifulsoup4==4.13.4 lxml==5.4.0
      - name: Build and validate EPUB
        run: python scripture_reader/build_reader.py
      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: bible-story-first-reader-${{ github.ref_name }}
          path: generated/Scripture_Stories_English_Reader_66_Books.epub
          retention-days: 60
      - name: Keep download available on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f generated/Scripture_Stories_English_Reader_66_Books.epub
          if ! git diff --cached --quiet; then
            git commit -m "Build story-first English Bible EPUB"
            git push origin HEAD:${{ github.ref_name }}
          fi
