name: Falelo — restore pre-stories production (one click)
# Press "Run workflow" once to restore both the previous Worker and Pages.
# Commands and target deployment IDs live only in the private repository.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: falelo-production-public-runner
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout protected rollback procedure
        uses: actions/checkout@v4
        with:
          repository: sheminofficial/Shemin-Official
          ref: feat/falelo-stories-production-candidate-20261031
          token: ${{ secrets.FALELO_BUILD }}
          persist-credentials: false
          path: source
      - name: Restore verified prior deployments without touching user data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FALELO_PAGES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
        run: bash source/scripts/falelo-stories-rollback.sh
      - name: Remove private files from runner
        if: always()
        run: rm -rf source
