name: Falelo private preview build
# Verify branded light-theme preview.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/falelo-private-preview.yml']
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private source branch
        required: true
        default: feat/falelo-stories-app-preview-20261030
        type: string

permissions:
  contents: read

jobs:
  preview:
    if: ${{ github.event_name == 'push' || inputs.source_ref == 'feat/falelo-stories-app-preview-20261030' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout private source on ephemeral runner
        uses: actions/checkout@v4
        with:
          repository: sheminofficial/Shemin-Official
          ref: feat/falelo-stories-app-preview-20261030
          token: ${{ secrets.FALELO_BUILD }}
          persist-credentials: false
          path: source
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Install, test, and build
        working-directory: source
        run: |
          run_private() {
            local label="$1"; shift
            if ! "$@" >"/tmp/falelo-${label}.log" 2>&1; then
              echo "Private ${label} failed; details withheld from public logs."
              exit 1
            fi
            echo "Private ${label} passed."
          }
          run_private install npm install --no-audit --no-fund
          run_private scala npm run build:learning
          run_private tests npm test
          run_private build npm run build
          cd falelo-stories/player
          run_private stories-install npm install --no-audit --no-fund
          run_private stories-tests npm test
          run_private stories-build npm run build
          mkdir -p ../../dist/stories
          cp -R dist/. ../../dist/stories/
      - name: Save private release and verify
        id: deliver
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.FALELO_BUILD }}
        run: |
          set -euo pipefail
          tar -C dist -czf falelo-preview.tar.gz .
          sha256sum falelo-preview.tar.gz > falelo-preview.sha256
          tag="falelo-preview-${GITHUB_RUN_ID}"
          gh release create "$tag" falelo-preview.tar.gz falelo-preview.sha256 --repo sheminofficial/Shemin-Official --target "feat/falelo-stories-app-preview-20261030" --title "Falelo preview ${GITHUB_RUN_ID}" --notes "Private preview build from an isolated branch." --prerelease
          gh release download "$tag" --repo sheminofficial/Shemin-Official --pattern falelo-preview.tar.gz --dir verify
          cmp falelo-preview.tar.gz verify/falelo-preview.tar.gz
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Private release verified: $tag"
      - name: Deploy Pages preview
        if: ${{ steps.deliver.outcome == 'success' }}
        working-directory: source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FALELO_PAGES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name falelo --branch feat-falelo-stories-preview
      - name: Remove temporary runner copies
        if: always()
        run: |
          rm -f /tmp/falelo-*.log
          rm -rf source/verify source/falelo-preview.tar.gz source/falelo-preview.sha256
          rm -rf source
