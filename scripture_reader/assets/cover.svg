<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">The Bible, Retold</title>
  <desc id="cover-desc">Warm dark-blue cover with a golden horizon, an open path, and the title of the literary adaptation.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101d35"/>
      <stop offset="0.68" stop-color="#294769"/>
      <stop offset="1" stop-color="#d58b4b"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4ce8a"/>
      <stop offset="1" stop-color="#b66c3f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1800" fill="url(#sky)"/>
  <circle cx="600" cy="1090" r="155" fill="#f8d98e" opacity="0.92"/>
  <path d="M0 1190 Q300 1080 600 1180 T1200 1170 V1800 H0Z" fill="#172b37"/>
  <path d="M530 1800 Q565 1440 600 1190 Q635 1440 735 1800Z" fill="url(#path)" opacity="0.94"/>
  <path d="M120 1330 Q330 1200 540 1280 M1080 1330 Q860 1200 655 1280" fill="none" stroke="#45605c" stroke-width="18" opacity="0.65"/>
  <text x="600" y="280" text-anchor="middle" fill="#f7dfae" font-family="Georgia, serif" font-size="62" letter-spacing="10">THE</text>
  <text x="600" y="430" text-anchor="middle" fill="#fff7e8" font-family="Georgia, serif" font-size="128" font-weight="bold">BIBLE, RETOLD</text>
  <line x1="235" y1="500" x2="965" y2="500" stroke="#d7a65c" stroke-width="4"/>
  <text x="600" y="590" text-anchor="middle" fill="#f2d9b0" font-family="Arial, sans-serif" font-size="42">A LITERARY ADAPTATION FOR</text>
  <text x="600" y="650" text-anchor="middle" fill="#f2d9b0" font-family="Arial, sans-serif" font-size="42">YOUNG ENGLISH READERS</text>
  <text x="600" y="1650" text-anchor="middle" fill="#f9e9c9" font-family="Arial, sans-serif" font-size="34" letter-spacing="4">FAITH · LITERATURE · ENGLISH</text>
</svg>
